name: jellyOS
options:
  bundleIdPrefix: mobi.jamie
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  JellyKit:
    path: Packages/JellyKit
targets:
  jellyOS:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [Apps/jellyOS]
    dependencies:
      - package: JellyKit
        product: JellyComposition
      - package: JellyKit
        product: JellyPresentation
    entitlements:
      path: Apps/jellyOS/jellyOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: Apps/jellyOS/Info.plist
      properties:
        CFBundleDisplayName: jellyOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: jellyOS finds Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mobi.jamie.jellyOS
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
        ENABLE_HARDENED_RUNTIME: true
  tvJelly:
    type: application
    platform: tvOS
    sources: [Apps/tvJelly]
    dependencies:
      - package: JellyKit
        product: JellyComposition
      - package: JellyKit
        product: JellyPresentationTV
    info:
      path: Apps/tvJelly/Info.plist
      properties:
        CFBundleDisplayName: jellyOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: jellyOS finds Jellyfin servers on your local network.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mobi.jamie.tvJelly
  jellyOSUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources: [UITests/jellyOSUITests]
    dependencies:
      - target: jellyOS
      - package: JellyKit
        product: JellyAccessibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mobi.jamie.jellyOSUITests
        TEST_TARGET_NAME: jellyOS
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_IDENTITY[sdk=macosx*]: "-"
  tvJellyUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests/tvJellyUITests]
    dependencies:
      - target: tvJelly
      - package: JellyKit
        product: JellyAccessibility
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: mobi.jamie.tvJellyUITests
        TEST_TARGET_NAME: tvJelly
        GENERATE_INFOPLIST_FILE: true
schemes:
  jellyOS:
    build:
      targets:
        jellyOS: all
        jellyOSUITests: [test]
    test:
      targets: [jellyOSUITests]
  tvJelly:
    build:
      targets:
        tvJelly: all
        tvJellyUITests: [test]
    test:
      targets: [tvJellyUITests]
